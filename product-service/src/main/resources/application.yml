spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/demo_db
    username: postgres
    password: pg_test
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:/
    baseline-on-migrate: true